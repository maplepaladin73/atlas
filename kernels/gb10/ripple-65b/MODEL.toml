[model]
name = "ripple-65b"
hf_id = "ricursiveAI/Ripple-65B-Preview-NVFP4"
model_type = "ricursive"
architecture = "Dense PeriNorm Transformer, 4:1 Sliding/Global Attention"
parameters = "65B"
active_parameters = "65B"

# ── Kernels: the gb10 laguna-s-2.1 tree plus a small overlay ───────────────
# Ripple is dense attention (head_dim 128, sliding window) + a dense NVFP4
# SwiGLU FFN at hidden 5120 — the same shapes family the laguna-s-2.1 gb10
# tree already serves (HDIM=128 paged attention with sliding window, w4a16
# dense FFN). `kernel_source` compiles that tree; this target's `nvfp4/`
# overlay adds only what it lacks:
#   * ripple_ops.cu   — ripple_silu_mul_clamp (FFN clamp ±20) +
#                       ripple_valres_lerp (value-residual V input)
#   * embed_scale.cu  — bf16_scale_inplace (embed_scale = sqrt(5120))
#   * w4a4_gemm.cu    — w4a4_gemm_mfast (glm-5.3-flash's proven sm_121a
#                       M-fast W4A4 prefill GEMM; multi-row FFN passes run
#                       W4A4 at the checkpoint's input scales, as ModelOpt
#                       NVFP4 and the reference engine do)
# The [expected_absent.*] sections below are inherited from laguna-s-2.1's
# MODEL.toml (minus w4a4_gemm_mfast, which the overlay now ships).
kernel_source = "laguna-s-2.1"

# Architecture from the checkpoint's config.json.
layers_total = 80
layers_sliding_attention = 64
layers_full_attention = 16
layer_pattern = "4 sliding (RoPE, window 1024) then 1 global (NoPE, full)"
hidden_dim = 5120
head_dim = 128
q_heads = 80
kv_heads = 8
intermediate_size = 40960
vocab_size = 100352
max_position_embeddings = 2097152
sliding_window = 1024
rope_theta = 10000
vision = false
mtp_layers = 0
moe_experts = 0

# The vendor ships no sampling recommendation (generation_config.json carries
# token ids only). Conservative defaults until measured.
[sampling.thinking_text]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[sampling.thinking_coding]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[sampling.non_thinking]
temperature = 0.7
top_p = 0.8
top_k = 20
presence_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[sampling.tools]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
frequency_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[behavior]
# The model opens `<think>` itself (the generation prompt does not), like the
# vendor's SGLang reasoning detector expects.
thinking_in_tools = true
max_thinking_budget = 8192
# The vendor's reference requires an unquantized BF16 KV cache.
default_kv_dtype = "bf16"
tool_call_parser = "hermes"

[[model_types]]
model_type = "ricursive"
hidden_size = 5120

# DFlash2 drafter: 4 SWA(4096)+RoPE layers then 1 full-attention NoPE layer,
# 4-tap dynamic convs, top-32 selector, 16-token blocks. Its global layer was
# trained on 16K-token rows (12,288 context + 4,096 predicted); the vendor's
# SGLang wrapper refuses a draft window below 16384, so the context window
# kept for the drafter is 16384.
[dflash]
draft_model = "ricursiveAI/Ripple-65B-Preview-DFlash2"
gamma = 16
window_size = 16384
mask_token_id = 100278
target_layer_ids = [1, 20, 39, 58, 77]


[expected_absent.moe_w4a16]
moe_w4a16_grouped_gemm_ptrtable_e8m0 = """
E8M0-scale twin; forward_k2/k3 gate on handle != 0 plus the checkpoint's
scale format, and fall back to the non-e8m0 ptrtable kernels compiled in
this target's own moe_w4a16_grouped_gemm.cu. This target compiles Laguna's sources, which ship FP8 scales,
never E8M0."""
moe_w4a16_grouped_gemm_ptrtable_t_e8m0 = "Same family — transposed twin; non-e8m0 sibling resolves here."
moe_w4a16_grouped_gemm_ptrtable_t_k64_e8m0 = "Same family — k64 twin; non-e8m0 sibling resolves here."
moe_w4a16_fused_gate_up_t_e8m0 = "Same family — fused gate/up twin; non-e8m0 sibling resolves here."
moe_w4a16_fused_gate_up_t_k64_e8m0 = "Same family — fused k64 twin; non-e8m0 sibling resolves here."
moe_w4a16_fused_gate_up_t_k64_fp4 = "FP4-scale twin of the fused k64 kernel; scale-format-gated like the e8m0 twins; the plain sibling resolves from this target's moe_w4a16_grouped_gemm.cu."
moe_w4a16_down_t_k64_fp4 = "FP4-scale down-projection twin; scale-format-gated; plain sibling resolves here."


